# Prometheus Configuration
# Scrape configurations for monitoring the Anomaly Detection stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Attach labels to time series
  external_labels:
    monitor: "anomaly-detection"

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional)
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # Backend API metrics
  - job_name: "anomaly-backend"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL metrics (if using postgres_exporter)
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'database'

  # Node exporter for system metrics (optional)
  # - job_name: 'node'
  #   static_configs:
