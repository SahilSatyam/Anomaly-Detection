# Google Cloud Build configuration
# Builds and deploys both backend and frontend to Cloud Run

steps:
  # Step 1: Build Backend Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/anomaly-backend:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/anomaly-backend:latest"
      - "./backend"
    id: "build-backend"

  # Step 2: Build Frontend Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/anomaly-frontend:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/anomaly-frontend:latest"
      - "--build-arg"
      - "REACT_APP_API_URL=${_BACKEND_URL}"
      - "./frontend"
    id: "build-frontend"

  # Step 3: Push Backend image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/anomaly-backend:$COMMIT_SHA"]
    id: "push-backend"
    waitFor: ["build-backend"]

  # Step 4: Push Frontend image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/anomaly-frontend:$COMMIT_SHA"]
    id: "push-frontend"
    waitFor: ["build-frontend"]

  # Step 5: Deploy Backend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "anomaly-backend"
      - "--image"
      - "gcr.io/$PROJECT_ID/anomaly-backend:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "DATABASE_URL=${_DATABASE_URL},LOG_LEVEL=INFO,LOG_FORMAT=json"
      - "--add-cloudsql-instances"
      - "${_CLOUD_SQL_CONNECTION}"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "2"
      - "--port"
      - "8000"
    id: "deploy-backend"
    waitFor: ["push-backend"]

  # Step 6: Deploy Frontend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "anomaly-frontend"
      - "--image"
      - "gcr.io/$PROJECT_ID/anomaly-frontend:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "256Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "2"
      - "--port"
      - "80"
    id: "deploy-frontend"
    waitFor: ["push-frontend", "deploy-backend"]

# Substitution variables (set these in Cloud Build triggers)
substitutions:
  _REGION: "us-central1"
  _DATABASE_URL: "" # Set in Cloud Build trigger
  _CLOUD_SQL_CONNECTION: "" # Format: project:region:instance
  _BACKEND_URL: "" # Set after first backend deploy

# Store images in Container Registry
images:
  - "gcr.io/$PROJECT_ID/anomaly-backend:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/anomaly-backend:latest"
  - "gcr.io/$PROJECT_ID/anomaly-frontend:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/anomaly-frontend:latest"

# Build timeout
timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
